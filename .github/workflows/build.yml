name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find vs installation
        id: vswhere
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%>> %GITHUB_ENV%

      - name: Build
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd src

          REM Build static
          call msvcbuild.bat static
          mkdir -p ..\artifact\windows\static
          move *.lib ..\artifact\windows\static\ 2>nul
          move luajit.exe ..\artifact\windows\static\ 2>nul

          REM Build dynamic
          call msvcbuild.bat dynamic
          mkdir -p ..\artifact\windows\dynamic
          move *.lib ..\artifact\windows\dynamic\ 2>nul
          move *.dll ..\artifact\windows\dynamic\ 2>nul
          move luajit.exe ..\artifact\windows\dynamic\ 2>nul

      - name: Package artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path artifact/windows/static/* -DestinationPath LuaJIT-windows-static.zip
          Compress-Archive -Path artifact/windows/dynamic/* -DestinationPath LuaJIT-windows-dynamic.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-windows
          path: |
            LuaJIT-windows-static.zip
            LuaJIT-windows-dynamic.zip

  build-linux:
    name: Build (Linux64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: |
          cd src

          make clean
          make CC=gcc BUILDMODE=static XCFLAGS="-fPIC"
          mkdir -p ../artifact/linux/static
          cp luajit ../artifact/linux/static/ 2>/dev/null || true
          cp libluajit.a ../artifact/linux/static/ 2>/dev/null || true

          make clean
          make CC=gcc BUILDMODE=dynamic
          mkdir -p ../artifact/linux/dynamic
          cp luajit ../artifact/linux/dynamic/ 2>/dev/null || true
          cp libluajit.so ../artifact/linux/dynamic/ 2>/dev/null || true

      - name: Package artifacts
        run: |
          cd artifact/linux/static
          tar -czf ../../../LuaJIT-linux-static.tar.gz *
          cd ../dynamic
          tar -czf ../../../LuaJIT-linux-dynamic.tar.gz *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-linux
          path: |
            LuaJIT-linux-static.tar.gz
            LuaJIT-linux-dynamic.tar.gz
