name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find vs installation
        id: vswhere
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%>> %GITHUB_ENV%

      - name: Build!!!
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd src
          call msvcbuild.bat static
          dir *.lib
          dir *.dll
          dir *.exe

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p artifact
          cp src/luajit.exe artifact/ || true
          cp src/*.dll artifact/ || true
          cp src/*.lib artifact/ || true
          zip -r LuaJIT-windows-msvc-x64.zip artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-windows-msvc-x64
          path: LuaJIT-windows-msvc-x64.zip

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install them build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build!!!
        run: |
          cd src
          make CC=gcc BUILDMODE=static

      - name: Package artifacts
        run: |
          mkdir -p artifact
          cp src/luajit artifact/
          cp src/*.so artifact/ || true
          tar -czf LuaJIT-linux-x64.tar.gz artifact/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-linux-x64
          path: LuaJIT-linux-x64.tar.gz
