name: Build

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Win64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find vs installation
        id: vswhere
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          echo VSINSTALL=%VSINSTALL%>> %GITHUB_ENV%

      - name: Build!!!
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          cd src

          call msvcbuild.bat static
          call msvcbuild.bat dynamic

          dir *.lib
          dir *.dll
          dir *.exe

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item src\luajit.exe artifact -ErrorAction SilentlyContinue
          Copy-Item src\*.dll artifact -ErrorAction SilentlyContinue
          Copy-Item src\*.lib artifact -ErrorAction SilentlyContinue
          Compress-Archive -Path artifact\* -DestinationPath LuaJIT-windows-msvc-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-windows-msvc-x64
          path: LuaJIT-windows-msvc-x64.zip

  build-linux:
    name: Build (Linux64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build
        run: |
          cd src

          make clean
          make CC=gcc BUILDMODE=static XCFLAGS="-fPIC"

          mkdir -p ../artifact
          cp luajit ../artifact/
          cp libluajit.a ../artifact/ || true

          make clean
          make CC=gcc BUILDMODE=dynamic

          cp luajit ../artifact/luajit-dynamic || true
          cp libluajit.so ../artifact/ || true

      - name: Package artifacts
        run: |
          cd artifact
          tar -czf ../LuaJIT-linux-x64.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuaJIT-linux-x64
          path: LuaJIT-linux-x64.tar.gz
